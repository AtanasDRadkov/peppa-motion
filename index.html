<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Peppa Motion Mirror</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#bce4f4;font:16px system-ui}main{position:fixed;inset:0}canvas{width:100%;height:100%;display:block}video{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:24%;max-width:220px;aspect-ratio:4/3;object-fit:contain;background:#222;border:3px solid white;border-radius:12px;transform:scaleX(-1)}#status{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#ffffffdd;padding:8px 15px;border-radius:20px;text-align:center;max-width:90%;font-size:14px}#start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 28px;border:0;border-radius:30px;background:#e94b50;color:white;font-size:20px;font-weight:700;box-shadow:0 4px 16px #0002} [hidden]{display:none!important}</style></head><body><main><canvas id="stage"></canvas><video id="camera" autoplay muted playsinline></video><button id="start">Start camera</button><div id="status">Allow camera access to play</div></main>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script>
const video=document.querySelector('video'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),button=document.querySelector('#start');let detector,stream,busy=false,playing=false,lastSeen=0,baseHip=null,baseTorso=null,lastFrame=0;
const neutral={x:.5,y:0,tilt:0,lean:0,arms:[[-.8,.65],[-.25,.97],[.8,.65],[.25,.97]],legs:[[-.12,1],[0,1],[.12,1],[0,1]]};let pose=structuredClone(neutral),target=structuredClone(neutral);
function resize(){let d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(canvas.clientWidth*d);canvas.height=Math.round(canvas.clientHeight*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function line(a,b,c,w=6,color='#d77c9e'){ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);if(c)ctx.lineTo(...c);ctx.lineWidth=w;ctx.strokeStyle=color;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function ellipse(x,y,rx,ry,fill,stroke){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2.5;ctx.stroke()}}
function shape(fn,fill,stroke){ctx.beginPath();fn();ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2.5;ctx.stroke()}}
function limb(start,v1,v2,l1,l2,foot=false){let mid=[start[0]+v1[0]*l1,start[1]+v1[1]*l1],end=[mid[0]+v2[0]*l2,mid[1]+v2[1]*l2];line(start,mid,end,6);if(foot){line([end[0]-5,end[1]],[end[0]+8,end[1]],null,9,'#28242b')}else{let angle=Math.atan2(v2[1],v2[0]);for(let a of [-.65,0,.65])line(end,[end[0]+9*Math.cos(angle+a),end[1]+9*Math.sin(angle+a)],null,3.4)}}
function render(t){requestAnimationFrame(render);let w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);if(performance.now()-lastSeen>900&&playing){status.hidden=false;status.textContent='Step back so I can see your whole body';}let f=0.25;for(let k of ['x','y','tilt','lean'])pose[k]+=(target[k]-pose[k])*f;for(let k of ['arms','legs'])for(let i=0;i<4;i++)for(let j=0;j<2;j++)pose[k][i][j]+=(target[k][i][j]-pose[k][i][j])*f;
let s=Math.min(h/330,w/380),x=w*(.16+.68*pose.x),ground=h*.87,y=ground-75*s+pose.y*s;ctx.save();ctx.translate(x,ground+3);ctx.scale(s,s);ellipse(0,0,43,6,'#87bed0');ctx.restore();ctx.save();ctx.translate(x,y);ctx.scale(s,s);
// Legs follow knee and ankle directions; torso follows hip height.
limb([-17,20],pose.legs[0],pose.legs[1],25,24,true);limb([17,20],pose.legs[2],pose.legs[3],25,24,true);
ctx.save();ctx.rotate(pose.lean);limb([-23,-48],pose.arms[0],pose.arms[1],31,29);limb([23,-48],pose.arms[2],pose.arms[3],31,29);
shape(()=>{ctx.moveTo(-22,-66);ctx.quadraticCurveTo(0,-74,22,-66);ctx.lineTo(45,23);ctx.quadraticCurveTo(0,31,-45,23)},'#e94b50','#c83b43');
ctx.save();ctx.translate(0,-76);ctx.rotate(pose.tilt-pose.lean);ctx.save();ctx.translate(-20,-78);ctx.rotate(-.18);ellipse(0,0,9,21,'#ffb5cf','#d77c9e');ctx.restore();ctx.save();ctx.translate(6,-81);ctx.rotate(.15);ellipse(0,0,9,20,'#ffb5cf','#d77c9e');ctx.restore();
shape(()=>{ctx.moveTo(-43,-58);ctx.bezierCurveTo(-20,-83,9,-72,28,-58);ctx.lineTo(58,-53);ctx.bezierCurveTo(78,-50,78,-15,54,-12);ctx.bezierCurveTo(39,9,-12,13,-40,-4);ctx.bezierCurveTo(-62,-16,-61,-42,-43,-58)},'#ffb5cf','#d77c9e');ellipse(60,-34,15,20,'#fca7c8','#d77c9e');ellipse(56,-39,3,4,'#cc7196');ellipse(65,-33,3,4,'#cc7196');ellipse(-5,-50,10,10,'white','#d77c9e');ellipse(18,-54,10,10,'white','#d77c9e');ellipse(-1,-49,3.7,4,'#29232b');ellipse(22,-53,3.7,4,'#29232b');ellipse(-35,-23,12,12,'#f18eaf');ctx.beginPath();ctx.moveTo(-17,-16);ctx.quadraticCurveTo(0,3,19,-17);ctx.strokeStyle='#b85e80';ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();ctx.restore();ctx.restore();ctx.restore();}
requestAnimationFrame(render);
const good=p=>p&&p.score>.28;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const avg=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});function vector(a,b,old){if(!good(a)||!good(b))return old;let dx=-(b.x-a.x),dy=b.y-a.y,l=Math.hypot(dx,dy);return l>2?[dx/l,dy/l]:old}
function update(k){let p=Object.fromEntries(k.map(q=>[q.name,q]));let ls=p.left_shoulder,rs=p.right_shoulder,lh=p.left_hip,rh=p.right_hip;if(![ls,rs,lh,rh].every(good))return;let sh=avg(ls,rs),hip=avg(lh,rh),torso=Math.hypot(sh.x-hip.x,sh.y-hip.y);if(torso<12)return;lastSeen=performance.now();status.hidden=true;let W=video.videoWidth;target.x=clamp(1-hip.x/W,.03,.97);if(baseHip===null){baseHip=hip.y;baseTorso=torso}target.y=clamp((hip.y-baseHip)/Math.max(baseTorso,20)*65,-105,52);target.lean=clamp(Math.atan2(-(sh.x-hip.x),hip.y-sh.y),-.5,.5);if(good(p.left_ear)&&good(p.right_ear)){let a=p.left_ear,b=p.right_ear;target.tilt=clamp(Math.atan2(a.y-b.y,Math.abs(a.x-b.x)), -.55,.55)}else if(good(p.nose)){target.tilt=clamp(Math.atan2(-(p.nose.x-sh.x),sh.y-p.nose.y),-.5,.5)}
// Mirrored camera: anatomical left maps to screen left for a person facing camera.
for(let [i,side] of ['left','right'].entries()){let a=i*2;target.arms[a]=vector(p[side+'_shoulder'],p[side+'_elbow'],target.arms[a]);target.arms[a+1]=vector(p[side+'_elbow'],p[side+'_wrist'],target.arms[a+1]);target.legs[a]=vector(p[side+'_hip'],p[side+'_knee'],target.legs[a]);target.legs[a+1]=vector(p[side+'_knee'],p[side+'_ankle'],target.legs[a+1]);}}
async function track(t){if(!playing)return;requestAnimationFrame(track);if(busy||t-lastFrame<55||video.readyState<2)return;busy=true;lastFrame=t;try{let results=await detector.estimatePoses(video,{flipHorizontal:false});if(results.length)update(results[0].keypoints)}catch(e){status.hidden=false;status.textContent='Tracking interrupted. Reload to try again.';console.error(e)}finally{busy=false}}
async function start(){button.hidden=true;status.hidden=false;status.textContent='Starting camera…';try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera requires HTTPS. Open the hosted page.');if(!window.tf||!window.poseDetection)throw Error('Tracking library could not load. Check your internet connection.');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}});video.srcObject=stream;await video.play();status.textContent='Loading motion tracking…';try{await tf.setBackend('webgl');await tf.ready()}catch(e){await tf.setBackend('cpu');await tf.ready()}detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,enableSmoothing:true});playing=true;status.textContent='Stand facing the camera, with your whole body visible';requestAnimationFrame(track)}catch(e){stream?.getTracks().forEach(t=>t.stop());status.textContent=e.message||'Camera unavailable';button.hidden=false;button.textContent='Try again'}}button.addEventListener('click',start);addEventListener('pagehide',()=>{playing=false;stream?.getTracks().forEach(t=>t.stop());detector?.dispose()});
</script></body></html>
